openapi: 3.0.3
info:
  title: Employee Management System API
  version: 1.0.0
  description: REST API for employee and workforce management.
paths:
  /api/attendance/:
    get:
      operationId: attendance_list
      parameters:
      - in: query
        name: attendance_date
        schema:
          type: string
          format: date
      - in: query
        name: employee
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ABSENT
          - HALF_DAY
          - LATE
          - PRESENT
        description: |-
          * `PRESENT` - Present
          * `LATE` - Late
          * `HALF_DAY` - Half Day
          * `ABSENT` - Absent
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
    post:
      operationId: attendance_create
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attendance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Attendance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Attendance'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
  /api/attendance/{id}/:
